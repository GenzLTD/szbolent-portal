# ⚠️⚠️⚠️ 状态：未采用（存档参考，勿上机）────────────────────────────
#   2026-09-12 决策反转：企业站**未迁天翼**，最终落在腾讯云 1.14.202.161
#   （备案硬规则：企业备案接入商必须与企业主体一致 = 腾讯云）。
#   当前在跑的是 nginx-tencent-portal.conf（机器上 szbolent-portal-tencent）。
#   本文件仅保留「日后在具备企业主体的接入商处改迁」的参考实现。
# ─────────────────────────────────────────────────────────────────
# szbolent-portal — 天翼云 14.29.216.219 大陆门户入口（单机承载）
# 域名：szbolent.com.cn / www.szbolent.com.cn / api.szbolent.com.cn
#
# 拓扑（门户与 API 同机 · 2026-09-11 方案 A：门户由腾讯云改迁天翼）：
#   https://www.szbolent.com.cn  → 静态 SPA（/var/www/szbolent-portal/dist）
#                  /v1/*        → 本机 Looma backend 127.0.0.1:5203（同源，免 CORS、不出公网）
#                  /wp-json/*   → 阿里云 WordPress（headless 博客，过渡态）
#   https://szbolent.com.cn      → 301 → https://www.szbolent.com.cn（canonical 收敛）
#   https://api.szbolent.com.cn  → 本机 Looma backend 127.0.0.1:5203（大陆 API 入口）
#
# ⚠️ 端口差异（勿照抄腾讯云/本机配置）：
#   天翼 Looma 容器映射到**宿主 127.0.0.1:5203**；腾讯云与本机才是 :5200。
#   此处写 5200 会整站 502（本机 5200 无监听）。
#
# ⚠️ 备案接入（硬前置，先办再上线）：
#   本机属**天翼云**（中国电信）。原 ICP 备案接入商为腾讯云，域名解析切到本机后
#   须先在**天翼云**办理「新增接入备案」，否则判「接入信息不实」→ 整改甚至取消备案号。
#   备案主体：深伯乐（深圳）科技有限公司 · 粤ICP备2026134984号-1
#
# ⚠️ 证书：三域共用一张 DV 证书（cert-name = szbolent.com.cn），部署前先签发。
#   本机 certbot 走 webroot，ACME 目录 /var/www/certbot（已存在）。
#   certbot certonly --webroot -w /var/www/certbot \
#     -d szbolent.com.cn -d www.szbolent.com.cn -d api.szbolent.com.cn \
#     --cert-name szbolent.com.cn
#
# 安装（天翼 nginx 1.18.0 Ubuntu，sites-available/sites-enabled 结构）：
#   cp nginx-tianyi-portal.conf /etc/nginx/sites-available/szbolent-portal-tianyi
#   ln -sf /etc/nginx/sites-available/szbolent-portal-tianyi /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# 与既有站点共存（勿动，靠 server_name 分流）：
#   sites-enabled/looma       — 80 default_server（PlanetX / /ppi / /circle / /tspace 的 IP 入口）
#   sites-enabled/circle-genz — circle.genz.ltd（鸿蒙元服务生产入口）
#
# 注：本机 nginx 1.18，HTTP/2 使用 `listen 443 ssl http2` 旧语法（`http2 on` 需 1.25+）

# ─────────────────────────────────────────────
# HTTP：ACME 验证 + 全量跳 HTTPS
# ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name szbolent.com.cn www.szbolent.com.cn api.szbolent.com.cn;

    # certbot webroot（天翼已存在该目录，与 circle-genz 共用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────
# HTTPS：根域 → www（canonical 收敛，避免重复内容）
# ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name szbolent.com.cn;

    ssl_certificate     /etc/letsencrypt/live/szbolent.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szbolent.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://www.szbolent.com.cn$request_uri;
}

# ─────────────────────────────────────────────
# HTTPS：门户主站
# ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.szbolent.com.cn;

    ssl_certificate     /etc/letsencrypt/live/szbolent.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szbolent.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：证书稳定运行一周后再开启（开启后浏览器强制 HTTPS，回退成本高）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/szbolent-portal/dist;
    index index.html;

    client_max_body_size 32m;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Looma API —— 同源反代本机，前端 VITE_LOOMA_API_BASE 留空即走这里
    # 天翼端口是 5203（不是腾讯云的 5200）
    location /v1/ {
        proxy_pass http://127.0.0.1:5203;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    # 健康检查直通 Looma
    location = /health {
        proxy_pass http://127.0.0.1:5203/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # WordPress REST —— headless 博客（过渡态，回源阿里云 WP）
    location /wp-json/ {
        proxy_pass http://47.115.168.107;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # Vite 产物带 content hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA history 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─────────────────────────────────────────────
# HTTPS：API 子域（大陆 API 入口，指向本机 Looma）
# ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.szbolent.com.cn;

    ssl_certificate     /etc/letsencrypt/live/szbolent.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szbolent.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:5203;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
    }
}
