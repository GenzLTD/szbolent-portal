name: Fix ICP comment + dump live config (one-off)

on:
  workflow_dispatch:

jobs:
  fix-and-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          config: |
            Host tencent
              HostName 1.14.202.161
              User ubuntu
              StrictHostKeyChecking no

      - name: Fix ICP comment line (if sudo ok) + dump
        run: |
          ssh tencent 'bash -s' <<'ENDSSH'
            set -u
            F=$(readlink -f /etc/nginx/sites-enabled/szbolent-portal-tencent)
            echo "conf_file=$F"
            if sudo -n true 2>/dev/null; then
              echo "SUDO_OK applying comment fix"
              sudo sed -i 's/企业备案（YEDALL LIMITED）/企业备案 · 主体 深伯乐（深圳）科技有限公司（粤ICP备2026134984号-1）/' "$F"
              sudo nginx -t 2>&1
            else
              echo "SUDO_NEED_PW skip fix, dump only"
            fi
            echo "===NGINX_BEGIN==="
            cat "$F"
            echo "===NGINX_END==="
          ENDSSH
