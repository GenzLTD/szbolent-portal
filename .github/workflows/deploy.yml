name: Deploy Portal SPA to Tencent (1.14.202.161)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'nginx/nginx-tencent-portal.conf'
      - '.github/workflows/deploy-tencent.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4 with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build SPA
        run: npm run build            # 输出 dist/

      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY_TENCENT }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          config: |
            Host tencent
              HostName 1.14.202.161
              User ubuntu                   # 远端机器用户 ≠ 阿里云的 root
              StrictHostKeyChecking no

      - name: Verify SSH connectivity
        run: ssh tencent 'echo "tencent-deploy-ready"'

      - name: Sync dist + nginx config (暂存)
        run: |
          ssh tencent 'mkdir -p /var/www/szbolent-portal/dist /var/www/szbolent-portal/nginx.new'
          rsync -avz --delete dist/ tencent:/var/www/szbolent-portal/dist/
          rsync -avz nginx/nginx-tencent-portal.conf tencent:/var/www/szbolent-portal/nginx.new/szbolent-portal-tencent.conf

      - name: Install nginx site + reload (配置变更时)
        run: |
          ssh tencent bash -s <<'ENDSSH'
            set -e
            SRC=/var/www/szbolent-portal/nginx.new/szbolent-portal-tencent.conf
            DST=/etc/nginx/sites-enabled/szbolent-portal-tencent            if diff -q "$SRC" "$DST" >/dev/null 2>&1; then
              echo "⏭ nginx 站点配置无变化，跳过 reload"
              rm -f "$SRC"
            else
              cp "$SRC" "$DST"
              rm -f "$SRC"
              nginx -t && systemctl reload nginx
              echo "✅ Nginx 站点 szbolent-portal-tencent 已更新并 reload"
            fi
          ENDSSH

      - name: Health check
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "%{http_code}\n" https://www.szbolent.com.cn | grep -q "^200$" \
            && echo "✅ https://www.szbolent.com.cn 返回 200" \
            || (echo "⚠️官网未响应 200" && exit 1)
