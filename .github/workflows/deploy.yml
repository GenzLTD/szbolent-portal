name: Deploy Portal SPA to Tencent (1.14.202.161)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      install_nginx_config:
        description: '是否把仓库副本安装到机器（默认 false：机器为准，仅做漂移检查）'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Build SPA
        run: npm run build            # 输出 dist/

      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          config: |
            Host tencent
              HostName 1.14.202.161
              User ubuntu                   # 远端机器用户 ≠ 阿里云的 root
              StrictHostKeyChecking no

      - name: Verify SSH connectivity
        run: ssh tencent 'echo "tencent-deploy-ready"'

      - name: Sync SPA dist
        run: |
          ssh tencent 'mkdir -p /var/www/szbolent-portal/dist'
          rsync -avz --delete dist/ tencent:/var/www/szbolent-portal/dist/

      - name: Stage nginx config + drift check（机器为准，默认不写机器）
        run: |
          ssh tencent 'mkdir -p /var/www/szbolent-portal/nginx.new'
          rsync -avz nginx-tencent-portal.conf tencent:/var/www/szbolent-portal/nginx.new/szbolent-portal-tencent.conf
          ssh tencent bash -s <<'ENDSSH'
            set -u
            SRC=/var/www/szbolent-portal/nginx.new/szbolent-portal-tencent.conf
            DST=$(readlink -f /etc/nginx/sites-enabled/szbolent-portal-tencent || true)
            if [ -z "$DST" ] || [ ! -f "$DST" ]; then
              echo "::warning::机器上未找到 szbolent-portal-tencent 站点（sites-enabled 软链缺失），请人工确认站点是否已安装"
              exit 0
            fi
            echo "机器站点配置：$DST"
            if diff -q "$SRC" "$DST" >/dev/null 2>&1; then
              echo "✅ nginx 配置无漂移（仓库副本 == 机器）"
            else
              echo "::warning::nginx 配置已漂移：仓库副本 != 机器。按「机器为准」口径，本次不写机器。"
              echo "---- diff（左 = 机器现行，右 = 仓库副本）----"
              diff -u "$DST" "$SRC" || true
              echo "--------------------------------------------------"
              echo "如确认要以仓库副本覆盖机器，请手动触发本 workflow 并勾选 install_nginx_config。"
            fi
          ENDSSH

      - name: Install nginx config + reload（仅在手动勾选 install_nginx_config 时）
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.install_nginx_config == 'true' }}
        run: |
          ssh tencent bash -s <<'ENDSSH'
            set -euo pipefail
            SRC=/var/www/szbolent-portal/nginx.new/szbolent-portal-tencent.conf
            DST=/etc/nginx/sites-available/szbolent-portal-tencent
            TS=$(date +%Y%m%d-%H%M%S)
            sudo cp -a "$DST" "$DST.bak-$TS"
            sudo cp "$SRC" "$DST"
            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "✅ nginx 配置已安装并 reload（备份：$DST.bak-$TS）"
            else
              sudo cp -a "$DST.bak-$TS" "$DST"
              echo "::error::nginx -t 校验失败，已回滚到 $DST.bak-$TS"
              exit 1
            fi
          ENDSSH

      - name: Health check
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "%{http_code}\n" https://www.szbolent.com.cn | grep -q "^200$" \
            && echo "✅ https://www.szbolent.com.cn 返回 200" \
            || (echo "⚠️官网未响应 200" && exit 1)
