# szbolent-portal 本地仿真 nginx 站点配置（HTTP 版，不上 TLS）
# 接入 servbay 的两种方式：
#
# 方式 A（推荐）：servbay GUI → Add site
#   - Domain: szbolent.local
#   - Port: 80
#   - Document root: /Users/jason/Projects/szbolent-portal/deploy-local/dist-stub
#   - 把下面 server { ... } 块内容贴到 "Custom nginx config" 框
#
# 方式 B（手动）：复制到 servbay 配置目录
#   mkdir -p ~/ServBay/etc/nginx/sites-enabled
#   cp szbolent-portal-local.conf ~/ServBay/etc/nginx/sites-enabled/
#   然后 servbay GUI 里 reload nginx
#
# 验证：
#   1. /etc/hosts 加：127.0.0.1 szbolent.local www.szbolent.local api.szbolent.local
#   2. curl http://szbolent.local/                   → 应看到占位首页
#   3. curl http://szbolent.local/v1/health          → 应 JSON 200
#   4. curl http://szbolent.local/wp-json/           → 302 (WP 未初始化，正常)

server {
    listen 80;
    listen [::]:80;
    server_name szbolent.local www.szbolent.local api.szbolent.local;

    # SPA 静态文件根 —— 2026-09-22 切换到真构建产物（阶段 2 已完成）
    root /Users/jason/Projects/szbolent-portal/dist;
    # 回滚用（占位页）：
    # root /Users/jason/Projects/szbolent-portal/deploy-local/dist-stub;
    index index.html;

    # 访问/错误日志（方便排查）
    access_log /Users/jason/Projects/szbolent-portal/deploy-local/logs/nginx-access.log;
    error_log  /Users/jason/Projects/szbolent-portal/deploy-local/logs/nginx-error.log;

    # SPA 路由 fallback（Vue Router history 模式必须）
    # 否则 /blog /chat /shelf 等路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 反代 0：中间层 PoC —— Zeroclaw 网关（:42617）门户契约适配层 =====
    # 精确匹配优先于下方 /v1/ 前缀，故只有 /v1/menus 与 /v1/pages/* 走中间层，
    # 其余 /v1/* 仍走 Looma。proxy_pass 不带 URI，保留原始路径。
    location = /v1/menus {
        proxy_pass http://127.0.0.1:42617;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60;
        proxy_connect_timeout 5;
    }

    # 动态页面 schema（同一适配层）
    location ^~ /v1/pages/ {
        proxy_pass http://127.0.0.1:42617;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60;
        proxy_connect_timeout 5;
    }

    # ===== 反代 1：looma-backend（生产对应 1.14.202.161:5200）=====
    location /v1/ {
        proxy_pass http://127.0.0.1:5200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 300;
        proxy_connect_timeout 5;
        proxy_send_timeout 300;
    }

    # ===== 反代 2：WordPress（生产对应 1.14.202.161:8080）=====
    # 容器内 WP 未启 pretty permalink，REST API 只认 ?rest_route=
    # rewrite /wp-json/(.*) → /index.php?rest_route=/$1（break 防止再次匹配）
    location /wp-json/ {
        rewrite ^/wp-json/(.*)$ /index.php?rest_route=/$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 300;
        proxy_connect_timeout 5;
    }

    # WordPress 媒体/上传
    location /wp-content/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # WordPress 后台登录页（精确匹配，避免被 SPA fallback 兜底到占位首页）
    location = /wp-login.php {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    # WordPress 后台管理
    location /wp-admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    # 不缓存 HTML（dev 模式）
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }
}