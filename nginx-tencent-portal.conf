# szbolent-portal — 腾讯云 1.14.202.161 大陆门户入口
# 域名：szbolent.com.cn / www.szbolent.com.cn / api.szbolent.com.cn
# 备案：企业备案 · 主体 深伯乐（深圳）科技有限公司（粤ICP备2026134984号-1），接入商 = 腾讯云（本机）
#       ⚠️ 机器上原文此行写作「YEDALL LIMITED」（＝海外香港主体，Stripe 材料误贴），待同步更正
#
# 架构：
#   /            → 静态 SPA（Vue3 dist，/var/www/szbolent-portal/dist）
#   /v1/         → 本机 Looma backend :5200（同源，免 CORS、不出公网）
#   /wp-json/    → 阿里云 WordPress（headless 博客，过渡态）
#
# 阶段一（本文件）：仅 HTTP，用于 ACME 验证与首轮上线
# 阶段二：签发证书后追加 443 server 块并开启 301 强制跳转
#
# 安装：
#   cp nginx-tencent-portal.conf /etc/nginx/sites-available/szbolent-portal-tencent
#   ln -sf /etc/nginx/sites-available/szbolent-portal-tencent /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# ─────────────────────────────────────────────
# 门户主站（spa）
# ─────────────────────────────────────────────
server {
    server_name szbolent.com.cn www.szbolent.com.cn;

    root /var/www/szbolent-portal/dist;
    index index.html;

    client_max_body_size 32m;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ACME 验证（certbot webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Looma API —— 同源反代本机，前端 VITE_LOOMA_API_BASE 留空即走这里
    location /v1/ {
        proxy_pass http://127.0.0.1:5200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    # 健康检查直通 Looma，便于本机与外部监控
    location = /health {
        proxy_pass http://127.0.0.1:5200/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # WordPress REST —— headless 博客（过渡态，回源阿里云 WP）
    location /wp-json/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }

    # Vite 产物带 content hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA history 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/szbolent.com.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/szbolent.com.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# ─────────────────────────────────────────────
# API 子域（大陆 API 入口，指向本机 Looma）
# ─────────────────────────────────────────────
server {
    server_name api.szbolent.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:5200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/szbolent.com.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/szbolent.com.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.szbolent.com.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = szbolent.com.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name szbolent.com.cn www.szbolent.com.cn;
    return 404; # managed by Certbot




}
server {
    if ($host = api.szbolent.com.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.szbolent.com.cn;
    return 404; # managed by Certbot



}
